[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoscope-resistivity"
version = "0.1.0"
description = "Reproducible layered-earth DC resistivity experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Gabriel Chiazor Unomah"}]
dependencies = ["simpeg==0.25.0", "numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
geoscope = "geoscope.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
